[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amrag"
version = "0.1.0"
description = "Adaptive Multimodal RAG components"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "transformers",
  "Pillow",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
